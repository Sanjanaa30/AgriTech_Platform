<div class="p-6 max-w-7xl mx-auto">
  <h1 class="text-2xl font-bold text-gray-900 mb-6">Marketplace Listings</h1>
  
  <!-- Loading State -->
  <div *ngIf="loading" class="text-center py-12">
    <div class="inline-block animate-spin rounded-full h-12 w-12 border-4 border-green-500 border-t-transparent"></div>
    <p class="mt-4 text-gray-600">Loading crops...</p>
  </div>

  <!-- Crops Grid -->
  <div *ngIf="!loading" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
    <div *ngFor="let crop of listedCrops" 
         class="bg-white rounded-lg shadow-md overflow-hidden hover:shadow-lg transition">
      <div class="h-48 bg-gray-200 relative">
        <img *ngIf="crop.imageUrl" 
             [src]="crop.imageUrl" 
             [alt]="crop.name"
             class="w-full h-full object-cover">
        <div *ngIf="!crop.imageUrl" 
             class="flex items-center justify-center h-full">
          <svg class="w-16 h-16 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" 
                  d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z" />
          </svg>
        </div>
        <span class="absolute top-2 right-2 px-3 py-1 bg-green-600 text-white text-xs font-medium rounded-full">
          Listed
        </span>
      </div>

      <div class="p-4">
        <h3 class="text-lg font-semibold text-gray-900">{{ crop.name }}</h3>
        <p class="text-sm text-gray-600 mt-1">{{ crop.variety }}</p>
        
        <div class="mt-3 space-y-2">
          <div class="flex items-center text-sm text-gray-600">
            <svg class="w-4 h-4 mr-2 text-green-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" 
                    d="M7 7h.01M7 3h5c.512 0 1.024.195 1.414.586l7 7a2 2 0 010 2.828l-7 7a2 2 0 01-2.828 0l-7-7A1.994 1.994 0 013 12V7a4 4 0 014-4z" />
            </svg>
            {{ crop.category }}
          </div>
          <div class="flex items-center text-sm text-gray-600">
            <svg class="w-4 h-4 mr-2 text-green-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" 
                    d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z" />
            </svg>
            {{ crop.season }}
          </div>
          <div class="flex items-center text-sm text-gray-600">
            <svg class="w-4 h-4 mr-2 text-green-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" 
                    d="M20 7l-8-4-8 4m16 0l-8 4m8-4v10l-8 4m0-10L4 7m8 4v10M4 7v10l8 4" />
            </svg>
            Area: {{ crop.area }} acres
          </div>
        </div>

        <button (click)="toggleListing(crop)"
                class="mt-4 w-full px-4 py-2 bg-red-600 text-white rounded-lg hover:bg-red-700 transition">
          Unlist from Marketplace
        </button>
      </div>
    </div>
  </div>

  <!-- Empty State -->
  <div *ngIf="!loading && listedCrops.length === 0" class="text-center py-12">
    <svg class="mx-auto h-24 w-24 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" 
            d="M3 3h2l.4 2M7 13h10l4-8H5.4M7 13L5.4 5M7 13l-2.293 2.293c-.63.63-.184 1.707.707 1.707H17m0 0a2 2 0 100 4 2 2 0 000-4zm-8 2a2 2 0 11-4 0 2 2 0 014 0z" />
    </svg>
    <h3 class="mt-4 text-xl font-medium text-gray-900">No crops listed</h3>
    <p class="mt-2 text-gray-500">List your crops in My Crops section to make them visible to buyers</p>
  </div>
</div>
