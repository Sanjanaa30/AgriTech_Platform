<div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
  <!-- Header -->
  <div class="flex justify-between items-center mb-6">
    <div>
      <h1 class="text-3xl font-bold text-gray-900">My Wishlist</h1>
      <p class="mt-1 text-sm text-gray-600">Crops you're interested in</p>
    </div>
    <button 
      *ngIf="wishlistItems.length > 0"
      (click)="clearWishlist()"
      class="px-4 py-2 bg-red-600 text-white rounded-lg hover:bg-red-700 transition-colors">
      Clear All
    </button>
  </div>

  <!-- Loading State -->
  <div *ngIf="loading" class="text-center py-12">
    <div class="inline-block animate-spin rounded-full h-12 w-12 border-4 border-blue-500 border-t-transparent"></div>
    <p class="mt-4 text-gray-600">Loading wishlist...</p>
  </div>

  <!-- Empty State -->
  <div *ngIf="!loading && wishlistItems.length === 0" class="text-center py-12">
    <svg class="mx-auto h-24 w-24 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" 
            d="M4.318 6.318a4.5 4.5 0 000 6.364L12 20.364l7.682-7.682a4.5 4.5 0 00-6.364-6.364L12 7.636l-1.318-1.318a4.5 4.5 0 00-6.364 0z" />
    </svg>
    <h3 class="mt-4 text-xl font-medium text-gray-900">Your wishlist is empty</h3>
    <p class="mt-2 text-gray-500">Start adding crops you're interested in from the marketplace</p>
    <button 
      (click)="viewInMarketplace('')"
      class="mt-6 px-6 py-3 bg-blue-600 text-white rounded-lg hover:bg-blue-700 transition-colors">
      Browse Marketplace
    </button>
  </div>

  <!-- Wishlist Grid -->
  <div *ngIf="!loading && wishlistItems.length > 0" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
    <div *ngFor="let item of wishlistItems" 
         class="bg-white rounded-lg shadow-md hover:shadow-lg transition-shadow overflow-hidden">
      
      <!-- Crop Image -->
      <div class="relative h-48 bg-gray-200">
        <img 
          [src]="item.cropImage || 'assets/placeholder-crop.jpg'" 
          [alt]="item.cropName"
          class="w-full h-full object-cover">
        <button 
          (click)="removeFromWishlist(item.cropId)"
          class="absolute top-2 right-2 p-2 bg-white rounded-full shadow-md hover:bg-red-50 transition-colors"
          title="Remove from wishlist">
          <svg class="h-5 w-5 text-red-500" fill="currentColor" viewBox="0 0 24 24">
            <path d="M6 18L18 6M6 6l12 12" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
          </svg>
        </button>
      </div>

      <!-- Card Content -->
      <div class="p-4">
        <h3 class="text-lg font-semibold text-gray-900">{{ item.cropName }}</h3>
        <p class="text-sm text-gray-600 mt-1">{{ item.variety }}</p>
        
        <div class="mt-3 space-y-1">
          <div class="flex items-center text-sm text-gray-600">
            <svg class="h-4 w-4 mr-2 text-blue-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" 
                    d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" />
            </svg>
            <span>{{ item.farmerName }}</span>
          </div>
          <div class="flex items-center text-sm text-gray-600">
            <svg class="h-4 w-4 mr-2 text-blue-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" 
                    d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z" />
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" 
                    d="M15 11a3 3 0 11-6 0 3 3 0 016 0z" />
            </svg>
            <span>{{ item.farmerLocation }}</span>
          </div>
          <div class="flex items-center text-sm text-gray-600">
            <svg class="h-4 w-4 mr-2 text-blue-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" 
                    d="M7 7h.01M7 3h5c.512 0 1.024.195 1.414.586l7 7a2 2 0 010 2.828l-7 7a2 2 0 01-2.828 0l-7-7A1.994 1.994 0 013 12V7a4 4 0 014-4z" />
            </svg>
            <span>{{ item.category }}</span>
          </div>
          <div class="text-xs text-gray-500 mt-2">
            Added: {{ item.addedDate | date:'short' }}
          </div>
        </div>

        <!-- Action Buttons -->
        <div class="mt-4 flex gap-2">
          <button 
            (click)="placeOrder(item)"
            class="flex-1 px-4 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700 transition-colors text-sm font-medium">
            Order Now
          </button>
          <button 
            (click)="viewInMarketplace(item.cropId)"
            class="px-4 py-2 border border-blue-600 text-blue-600 rounded-lg hover:bg-blue-50 transition-colors text-sm font-medium">
            View Details
          </button>
        </div>
      </div>
    </div>
  </div>
</div>
