<div class="p-6 text-gray-800 max-w-7xl mx-auto">
  <!-- Header + Filter + Sort -->
  <div class="flex flex-col md:flex-row md:items-center md:justify-between gap-4 mb-6">
    <!-- Add Crop Button -->
    <button (click)="openAddCropModal()" 
            class="bg-green-600 hover:bg-green-700 text-white px-6 py-2 rounded-lg transition font-medium">
      + Add Crop
    </button>

    <div class="flex flex-col sm:flex-row items-center gap-3 w-full sm:w-auto">
      <!-- Filter by Status -->
      <div class="relative w-full sm:w-48">
        <select [(ngModel)]="filterStatus" (ngModelChange)="loadCrops()"
                class="w-full appearance-none border border-gray-300 text-sm px-3 py-2 pr-8 rounded-lg bg-white text-gray-700 focus:outline-none focus:ring-2 focus:ring-green-500 focus:border-green-500">
          <option value="">All Status</option>
          <option value="Sowing">Sowing</option>
          <option value="Growing">Growing</option>
          <option value="Harvesting">Harvesting</option>
          <option value="Ready for Market">Ready for Market</option>
          <option value="Diseased">Diseased</option>
          <option value="Irrigation Needed">Irrigation Needed</option>
        </select>
        <div class="pointer-events-none absolute inset-y-0 right-3 flex items-center text-gray-500">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7" />
          </svg>
        </div>
      </div>

      <!-- Sort By -->
      <div class="relative w-full sm:w-48">
        <select [(ngModel)]="sortBy" (ngModelChange)="loadCrops()"
                class="w-full appearance-none border border-gray-300 text-sm px-3 py-2 pr-8 rounded-lg bg-white text-gray-700 focus:outline-none focus:ring-2 focus:ring-green-500 focus:border-green-500">
          <option value="">Sort by</option>
          <option value="name">Name</option>
          <option value="sowingDate">Sowing Date</option>
          <option value="harvestDate">Harvest Date</option>
        </select>
        <div class="pointer-events-none absolute inset-y-0 right-3 flex items-center text-gray-500">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7" />
          </svg>
        </div>
      </div>
    </div>
  </div>

  <!-- Crop Cards -->
  <div class="space-y-4">
    <div *ngFor="let crop of filteredCrops">
      <app-crop-card [crop]="crop" 
                     (edit)="editCrop($event)" 
                     (delete)="deleteCrop($event)">
      </app-crop-card>
    </div>
  </div>

  <!-- Empty State -->
  <div *ngIf="filteredCrops.length === 0" class="text-center py-12">
    <svg class="mx-auto h-24 w-24 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" 
            d="M20 7l-8-4-8 4m16 0l-8 4m8-4v10l-8 4m0-10L4 7m8 4v10M4 7v10l8 4" />
    </svg>
    <h3 class="mt-4 text-xl font-medium text-gray-900">No crops found</h3>
    <p class="mt-2 text-gray-500">Start by adding your first crop to track</p>
  </div>

  <!-- Add/Edit Crop Modal -->
  <div *ngIf="showAddCropModal"
       class="fixed inset-0 z-50 bg-black bg-opacity-40 flex justify-center items-center p-4">
    <div class="bg-white w-full max-w-2xl max-h-[90vh] overflow-y-auto rounded-lg shadow-xl">
      
      <!-- Modal Header -->
      <div class="sticky top-0 bg-white border-b px-6 py-4 flex justify-between items-center">
        <h2 class="text-xl font-semibold text-gray-800">
          {{ isEditing ? '✏️ Edit Crop' : '🌱 Add New Crop' }}
        </h2>
        <button (click)="closeAddCropModal()"
                class="text-gray-400 hover:text-gray-600 transition">
          <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
          </svg>
        </button>
      </div>

      <!-- Modal Body -->
      <div class="px-6 py-4 space-y-4">
        <!-- Category -->
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">📂 Category *</label>
          <select [(ngModel)]="newCrop.category" 
                  (change)="onCategoryChange()"
                  class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-green-500">
            <option value="">Select Category</option>
            <option *ngFor="let cat of categories" [value]="cat">{{ cat }}</option>
          </select>
        </div>

        <!-- Crop Name -->
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">🌾 Crop Name *</label>
          <select [(ngModel)]="newCrop.name" 
                  (change)="onCropChange()"
                  class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-green-500">
            <option value="">Select Crop</option>
            <option *ngFor="let crop of cropOptions" [value]="crop.NAME">{{ crop.NAME }}</option>
          </select>
        </div>

        <!-- Season Badge -->
        <div *ngIf="seasonBadge">
          <span class="inline-block bg-green-100 text-green-700 text-xs font-medium px-3 py-1 rounded-full">
            🏷️ {{ seasonBadge }}
          </span>
        </div>

        <!-- Variety -->
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">🔤 Variety</label>
          <select *ngIf="varietyOptions.length > 0" 
                  [(ngModel)]="newCrop.variety"
                  class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-green-500">
            <option value="">Select Variety</option>
            <option *ngFor="let v of varietyOptions" [value]="v">{{ v }}</option>
          </select>
          <input *ngIf="varietyOptions.length === 0" 
                 type="text" 
                 [(ngModel)]="newCrop.variety"
                 placeholder="e.g., Roma, Basmati 1121"
                 class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-green-500" />
        </div>

        <!-- Dates -->
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">📅 Sowing Date *</label>
            <input type="date" 
                   [(ngModel)]="newCrop.sowingDate"
                   class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-green-500" />
          </div>
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">📆 Expected Harvest *</label>
            <input type="date" 
                   [(ngModel)]="newCrop.harvestDate"
                   class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-green-500" />
          </div>
        </div>

        <!-- Image Upload -->
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-2">📷 Crop Image</label>
          <div class="border-2 border-dashed border-gray-300 rounded-lg p-6 text-center cursor-pointer hover:border-green-500 transition"
               [class.border-green-500]="isDragOver"
               (drop)="onDrop($event)" 
               (dragover)="onDragOver($event)" 
               (dragleave)="onDragLeave($event)"
               (click)="imageInputRef.nativeElement.click()">
            <svg class="mx-auto h-12 w-12 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" 
                    d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12" />
            </svg>
            <p class="mt-2 text-sm text-gray-600">Click to upload or drag and drop</p>
            <p class="text-xs text-gray-500">PNG, JPG up to 10MB</p>
          </div>
          <input #imageInput 
                 type="file" 
                 (change)="onImageSelected($event)" 
                 accept="image/*" 
                 class="hidden" />
          
          <!-- Image Preview -->
          <div *ngIf="imagePreview" class="mt-3 relative inline-block">
            <img [src]="imagePreview" 
                 alt="Crop preview" 
                 class="w-32 h-32 object-cover rounded-lg border-2 border-gray-200" />
            <button type="button" 
                    (click)="removeImage()"
                    class="absolute -top-2 -right-2 bg-red-500 text-white rounded-full p-1 hover:bg-red-600 transition">
              <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
              </svg>
            </button>
          </div>
        </div>

        <!-- Status -->
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">⚙️ Status *</label>
          <select [(ngModel)]="newCrop.status"
                  class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-green-500">
            <option value="">Select Status</option>
            <option>Sowing</option>
            <option>Growing</option>
            <option>Harvesting</option>
            <option>Ready for Market</option>
            <option>Diseased</option>
            <option>Irrigation Needed</option>
          </select>
        </div>

        <!-- Area -->
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">📐 Area (acres)</label>
          <input type="number" 
                 [(ngModel)]="newCrop.area"
                 placeholder="e.g., 2.5"
                 class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-green-500" />
        </div>

        <!-- Irrigation Type -->
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">💧 Irrigation Type</label>
          <select [(ngModel)]="newCrop.irrigationType"
                  class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-green-500">
            <option value="">Select Type</option>
            <option>Drip</option>
            <option>Sprinkler</option>
            <option>Flood</option>
          </select>
        </div>

        <!-- Last Activity -->
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">🗒️ Last Activity</label>
          <input type="text" 
                 [(ngModel)]="newCrop.lastActivity"
                 placeholder="e.g., Fertilizer applied"
                 class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-green-500" />
        </div>

        <!-- Notes -->
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">🧾 Notes</label>
          <textarea [(ngModel)]="newCrop.notes"
                    rows="3"
                    placeholder="Add any additional notes about this crop..."
                    class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-green-500"></textarea>
        </div>
      </div>

      <!-- Modal Footer -->
      <div class="sticky bottom-0 bg-gray-50 border-t px-6 py-4 flex justify-end gap-3">
        <button (click)="closeAddCropModal()"
                class="px-4 py-2 border border-gray-300 text-gray-700 rounded-lg hover:bg-gray-100 transition">
          Cancel
        </button>
        <button (click)="saveCrop()"
                class="px-6 py-2 bg-green-600 text-white rounded-lg hover:bg-green-700 transition font-medium">
          {{ isEditing ? 'Update' : 'Save' }} Crop
        </button>
      </div>
    </div>
  </div>
</div>
